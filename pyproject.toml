[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice-suite"
version = "0.1.0"
description = "Voice-first personal agent: daily briefings and Discord meeting mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = [
  "py-cord[voice]>=2.7,<3",
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "openai>=1.0",
]

calendar = [
  "google-api-python-client>=2.0,<3",
  "google-auth-oauthlib>=1.0,<2",
]

test = ["pytest>=8,<9"]

[project.scripts]
voice-suite = "voice_suite.cli:main"
voice-tech = "voice_suite.technical_cli:main"
voice-bot = "voice_suite.runner:main"
codex-voice-bot = "voice_suite.codex_runner:main"
codex-local-bot = "voice_suite.codex_local_cli:main"
codex-chat = "voice_suite.codex_chat_cli:main"
podcast-render = "voice_suite.podcast_cli:main"
calendar-auth = "voice_suite.google_calendar_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_suite"]
