name: hermes-voice-suite

services:
  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-voice-suite:local
    restart: unless-stopped
    # The installed Hermes currently runs as root and reads /root/.hermes.
    # Keep the staged container compatible without copying secrets into Git.
    user: "0:0"
    working_dir: /root/.hermes
    # Discord voice uses a negotiated UDP session.  Keep this Linux VPS
    # service on the host network until the real voice test proves bridge
    # networking is safe for the deployment.
    network_mode: host
    env_file:
      - .env
    environment:
      VOICE_TECH_LEDGER_PATH: /var/lib/hermes/technical-ledger.sqlite3
      CODEX_VPS_WORKER_URL: http://127.0.0.1:8765
      CODEX_AUDITOR_URL: http://127.0.0.1:8766
      CODEX_WORKER_TOKEN: ${CODEX_WORKER_TOKEN:?set CODEX_WORKER_TOKEN in .env}
    volumes:
      - hermes-state:/var/lib/hermes
      - /usr/local/bin/hermes:/usr/local/bin/hermes:ro
      - /usr/local/lib/hermes-agent:/usr/local/lib/hermes-agent:ro
      - /usr/local/share/uv:/usr/local/share/uv:ro
      - /root/.hermes:/root/.hermes:ro
    depends_on:
      codex-worker:
        condition: service_started
      codex-auditor:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  codex-worker:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: hermes-voice-suite-codex:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      CODEX_HOME: /codex-home
      CODEX_REPO_PATH: /workspace
      CODEX_WORKER_TOKEN: ${CODEX_WORKER_TOKEN:?set CODEX_WORKER_TOKEN in .env}
      CODEX_SANDBOX: workspace-write
      CODEX_SKIP_GIT_REPO_CHECK: "1"
    command:
      - --worker-id
      - vps-codex
      - --role
      - implementer
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --repo
      - /workspace
    volumes:
      - .:/workspace
      - codex-home:/codex-home
    security_opt:
      - no-new-privileges:true

  codex-auditor:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: hermes-voice-suite-codex:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      CODEX_HOME: /codex-home
      CODEX_REPO_PATH: /workspace
      CODEX_WORKER_TOKEN: ${CODEX_WORKER_TOKEN:?set CODEX_WORKER_TOKEN in .env}
      CODEX_SANDBOX: read-only
      CODEX_SKIP_GIT_REPO_CHECK: "1"
    command:
      - --worker-id
      - vps-codex-auditor
      - --role
      - auditor
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --repo
      - /workspace
      - --sandbox
      - read-only
    volumes:
      - .:/workspace:ro
      - codex-home:/codex-home
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  codex-chat-worker:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: hermes-voice-suite-codex:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      CODEX_HOME: /codex-chat-home
      CODEX_REPO_PATH: /workspace
      CODEX_CHAT_WORKDIR: /workspace
      CODEX_CHAT_WORKER_TOKEN: ${CODEX_CHAT_WORKER_TOKEN:?set CODEX_CHAT_WORKER_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    entrypoint: ["codex-chat"]
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8777"
    volumes:
      - .:/workspace:ro
      - codex-chat-home:/codex-chat-home
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  codex-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.codex-discord
    image: hermes-voice-suite-codex-discord:local
    restart: unless-stopped
    network_mode: host
    environment:
      CODEX_DISCORD_BOT_TOKEN: ${CODEX_DISCORD_BOT_TOKEN:?set CODEX_DISCORD_BOT_TOKEN in .env}
      CODEX_DISCORD_GUILD_ID: ${CODEX_DISCORD_GUILD_ID:?set CODEX_DISCORD_GUILD_ID in .env}
      CODEX_DISCORD_TEXT_CHANNEL_ID: ${CODEX_DISCORD_TEXT_CHANNEL_ID:?set CODEX_DISCORD_TEXT_CHANNEL_ID in .env}
      CODEX_DISCORD_VOICE_CHANNEL_ID: ${CODEX_DISCORD_VOICE_CHANNEL_ID:?set CODEX_DISCORD_VOICE_CHANNEL_ID in .env}
      CODEX_DISCORD_ALLOWED_USER_ID: ${CODEX_DISCORD_ALLOWED_USER_ID:-}
      CODEX_CHAT_WORKER_URL: http://127.0.0.1:8777
      CODEX_CHAT_WORKER_TOKEN: ${CODEX_CHAT_WORKER_TOKEN:?set CODEX_CHAT_WORKER_TOKEN in .env}
      CODEX_CHAT_WORKER_TIMEOUT: ${CODEX_CHAT_WORKER_TIMEOUT:-90}
      CODEX_STT_MODEL: ${CODEX_STT_MODEL:-gpt-4o-mini-transcribe}
      CODEX_TTS_MODEL: ${CODEX_TTS_MODEL:-gpt-4o-mini-tts}
      CODEX_TTS_VOICE: ${CODEX_TTS_VOICE:-alloy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    depends_on:
      codex-chat-worker:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  hermes-state:
  codex-home:
  codex-chat-home:
